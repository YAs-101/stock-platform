server:
  port: 9999

spring:
  application:
    name: stock-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
    gateway:
      routes:
        - id: user-service
          uri: lb://stock-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: stock-data-service
          uri: lb://stock-data
          predicates:
            - Path=/api/stock/**
          filters:
            - StripPrefix=1
        - id: detect-service
          uri: lb://stock-detect
          predicates:
            - Path=/api/detect/**
          filters:
            - StripPrefix=1
        - id: stat-service
          uri: lb://stock-stat
          predicates:
            - Path=/api/stat/**
          filters:
            - StripPrefix=1
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:8080"
              - "null"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: false
            max-age: 3600

  jwt:
    secret: stock-platform-secret-key-2026
    expiration: 86400000

logging:
  level:
    com.stock.gateway: DEBUG
